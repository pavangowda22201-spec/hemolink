<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111a2a" />
  <title>RedSync | Hospital Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/app/dashboard.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app/dashboard.js" defer></script>
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <dialog id="workspace-dialog" class="workspace-dialog" aria-labelledby="dialog-title">
    <div class="dialog-frame">
      <div class="dialog-header">
        <div>
          <p class="eyebrow" id="dialog-eyebrow">REDSYNC OPERATIONS</p>
          <h2 id="dialog-title">Hospital workspace</h2>
        </div>
        <button class="icon-button" type="button" data-action="close-dialog" aria-label="Close dialog">×</button>
      </div>
      <div id="dialog-content"></div>
    </div>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
