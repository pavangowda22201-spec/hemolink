  .pulse-line{
    fill:none;
    stroke:var(--red);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:1400;
    stroke-dashoffset:1400;
    animation:draw 2.4s ease-out forwards;
  }
  @keyframes draw{ to{stroke-dashoffset:0;} }
  .pulse-line.flash{animation:draw 0.9s ease-out;}

  .mode-toggle{

  }

  .mode-btn.active{

  .card{

.stats-grid{

}

.stat-card{

.request-meta{

.request-meta span{

}
.stat-value{
  font-family:'Archivo',sans-serif;
  font-size:24px;
  font-weight:800;
  margin-bottom:4px;
}

.stat-label{
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  text-transform:uppercase;

}

@media (max-width:640px){
  .stats-grid{
    grid-template-columns:1fr 1fr;
  }
}

  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;

  button.small{padding:6px 12px;font-size:11px;}

  .badge{

    align-items:center;

  }

  .badge.urgent-critical{

  box-shadow:0 0 10px rgba(193,18,31,0.15);
}

.badge.urgent-urgent{

  border-color:rgba(224,168,46,0.4);

}

.badge.urgent-standard{

  .badge.status-matching{color:#ffb3b8;border-color:var(--red);}
  .badge.status-fulfilled{color:var(--green);border-color:rgba(45,139,95,0.4);}
  .badge.status-pending{color:var(--amber);border-color:rgba(224,168,46,0.4);}
  .badge.status-stood_down{color:var(--muted);}
  .badge.status-no_show{color:#ff6b74;border-color:var(--red);}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .muted{color:var(--muted);}
  .mono{font-family:var(--mono);}
  .empty{

    font-weight:800;

  }

    background:#141414;

    margin-top:8px;
  }
  .score-bar-fill{

    color:var(--muted);
    font-size:12px;
    cursor:pointer;

  }
  .switch-link:hover{color:var(--text);}
  .timer{
    font-family:var(--mono);
    font-size:13px;
    color:var(--amber);
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);

    border:1px solid var(--red);
    color:var(--text);
    padding:12px 20px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
/* =========================================================
   REDSYNC â€” VISUAL UPGRADE 01
   Safe UI-only styling
   ========================================================= */

:root{
  --bg:#0b0d10;
  --panel:#12161b;
  --panel-2:#171c22;
  --panel-3:#1c2229;
  --border:rgba(255,255,255,.09);
  --border-hover:rgba(255,255,255,.16);
  --text:#f7f7f5;
  --muted:#9299a3;
  --red:#d7192d;
  --red-hover:#ef263b;
  --green:#35a56f;
  --amber:#e4aa32;
  --shadow:0 14px 40px rgba(0,0,0,.28);
}

/* ---------- Overall surface ---------- */

body{
  background:
    radial-gradient(circle at 50% -10%, rgba(215,25,45,.08), transparent 38%),
    var(--bg);
}

header{
  padding-top:38px;
}

/* ---------- RedSync branding area ---------- */

.wordmark{
  font-size:clamp(30px,5vw,44px);
  letter-spacing:-.045em;
  line-height:1;
}

.wordmark span.dot{
  color:var(--red);
  text-shadow:0 0 18px rgba(215,25,45,.35);
}

.tagline{
  margin-top:8px;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.8;
}

/* ---------- ECG line ---------- */

.pulse-wrap{
  margin-top:24px;
  height:42px;
  opacity:.9;
}

.pulse-line{
  stroke:var(--red);
  stroke-width:2.2;
  filter:drop-shadow(0 0 5px rgba(215,25,45,.35));
}

/* ---------- Donor / Hospital navigation ---------- */

.mode-toggle{
  margin-top:18px;
  gap:8px;
}

.mode-btn{
  position:relative;
  padding:12px 24px 11px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-bottom:1px solid var(--border);
  border-radius:9px 9px 0 0;
  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.mode-btn:hover:not(.active){
  background:rgba(255,255,255,.05);
  border-color:var(--border-hover);
  transform:translateY(-1px);
}

.mode-btn.active{
  background:var(--panel-2);
  color:#fff;
  border-color:var(--border);
  box-shadow:
    inset 0 2px 0 var(--red),
    0 -4px 18px rgba(215,25,45,.06);
}

/* ---------- Main application surface ---------- */

.surface{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.018),
      rgba(255,255,255,.006)
    ),
    var(--panel-2);
  border:1px solid var(--border);
  border-radius:0 14px 14px 14px;
  padding:30px;
  box-shadow:var(--shadow);
}

/* ---------- Cards ---------- */

.card,
.stat-card{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.018),
      transparent
    ),
    var(--panel);
  border-color:var(--border);
  box-shadow:0 8px 24px rgba(0,0,0,.14);
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.card:hover,
.stat-card:hover{
  border-color:var(--border-hover);
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}

/* ---------- Section headings ---------- */

h2{
  font-size:20px;
  letter-spacing:-.025em;
}

.section-note{
  line-height:1.6;
}

/* ---------- Inputs ---------- */

input,
select{
  background:#0e1115;
  border-color:rgba(255,255,255,.10);
  min-height:42px;
  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input:hover,
select:hover{
  border-color:rgba(255,255,255,.16);
}

input:focus,
select:focus{
  background:#101419;
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(215,25,45,.10);
}

/* ---------- Buttons ---------- */

button{
  background:var(--red);
  border-radius:8px;
  min-height:40px;
  box-shadow:0 5px 14px rgba(215,25,45,.12);
  transition:
    background .2s ease,
    transform .15s ease,
    box-shadow .2s ease;
}

button:hover:not(:disabled){
  background:var(--red-hover);
  transform:translateY(-1px);
  box-shadow:0 7px 18px rgba(215,25,45,.20);
}

button:active:not(:disabled){
  transform:translateY(0);
}

button.secondary{
  background:rgba(255,255,255,.025);
  border-color:var(--border);
  box-shadow:none;
}

button.secondary:hover{
  background:rgba(255,255,255,.055);
  border-color:rgba(215,25,45,.55);
}

/* ---------- Statistics ---------- */

.stats-grid{
  gap:12px;
}

.stat-card{
  position:relative;
  overflow:hidden;
}

.stat-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:3px;
  height:100%;
  background:var(--red);
  opacity:.75;
}

.stat-value{
  font-size:27px;
}

.stat-label{
  font-size:10px;
  letter-spacing:.08em;
}

/* ---------- Badges ---------- */

.badge{
  font-size:10px;
  padding:4px 9px;
  font-weight:600;
}

.badge.blood{
  box-shadow:0 0 12px rgba(193,18,31,.08);
}

/* ---------- Responsive ---------- */

@media(max-width:640px){

  header{
    padding-top:26px;
  }

  main{
    padding-left:14px;
    padding-right:14px;
  }

  .mode-toggle{
    padding-left:14px;
    padding-right:14px;
  }

  .surface{
    padding:20px 16px;
    border-radius:0 12px 12px 12px;
  }

  .mode-btn{
    flex:1;
    padding-left:12px;
    padding-right:12px;
  }

  .stats-grid{
    gap:8px;
  }

  .stat-card{
    padding:13px;
  }

  .stat-value{
    font-size:23px;
  }
}
/* =========================================================
   REDSYNC â€” VISUAL UPGRADE 02
   Dashboard + request cards
   ========================================================= */

/* ---------- Dashboard spacing ---------- */

#donorView,
#hospitalView{
  animation:none;
}

@keyframes fadeInView{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ---------- Cards ---------- */

.card{
  position:relative;
  overflow:hidden;
}

.card::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(
    90deg,
    rgba(215,25,45,.55),
    transparent 70%
  );
  opacity:.45;
}

/* ---------- Request metadata ---------- */

.request-meta{
  gap:7px;
  margin-top:14px;
}

.request-meta span{
  background:rgba(255,255,255,.025);
  border-color:rgba(255,255,255,.08);
  border-radius:7px;
  padding:6px 9px;
  transition:background .2s ease,border-color .2s ease;
}

.request-meta span:hover{
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.14);
}

/* ---------- Blood badges ---------- */

.badge.blood{
  font-size:12px;
  font-weight:800;
  padding:5px 11px;
  letter-spacing:.04em;
}

/* ---------- Critical requests ---------- */

.badge.urgent-critical{
  box-shadow:
    0 0 0 1px rgba(215,25,45,.08),
    0 0 18px rgba(215,25,45,.13);
  animation:criticalGlow 2s ease-in-out infinite;
}

@keyframes criticalGlow{
  0%,100%{
    box-shadow:
      0 0 0 1px rgba(215,25,45,.08),
      0 0 12px rgba(215,25,45,.08);
  }
  50%{
    box-shadow:
      0 0 0 1px rgba(215,25,45,.16),
      0 0 20px rgba(215,25,45,.18);
  }
}

/* ---------- Profile score ---------- */

.profile-score{
  font-size:36px;
  letter-spacing:-.04em;
}

.score-bar{
  height:7px;
  background:#0d1013;
  border:1px solid rgba(255,255,255,.04);
}

.score-bar-fill{
  background:linear-gradient(
    90deg,
    var(--red),
    var(--amber)
  );
  box-shadow:0 0 10px rgba(215,25,45,.20);
}

/* ---------- Empty states ---------- */

.empty{
  background:rgba(255,255,255,.012);
  border-color:rgba(255,255,255,.10);
  line-height:1.6;
}

/* ---------- Timers ---------- */

.timer{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:600;
}

.timer::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 8px currentColor;
}

/* ---------- Verified badge ---------- */

.badge.verified{
  font-weight:600;
  box-shadow:0 0 12px rgba(53,165,111,.07);
}

/* ---------- Rows ---------- */

.row{
  row-gap:10px;
}

/* ---------- Links ---------- */

.switch-link{
  transition:color .2s ease;
}

.switch-link:hover{
  color:#fff;
}

/* ---------- Toast ---------- */

.toast{
  background:rgba(18,22,27,.96);
  backdrop-filter:blur(12px);
  border-color:rgba(215,25,45,.55);
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

/* ---------- Mobile request layout ---------- */

@media(max-width:640px){

  .request-meta span{
    font-size:11px;
    padding:5px 8px;
  }

  .profile-score{
    font-size:31px;
  }

  .card{
    padding:16px;
  }

}

/* =========================================================
   HEMOLINK — FINAL 2026 APP UI
   Visual foundation / mobile-first layer
   ========================================================= */

:root{
  --bg:#f5f6f8;
  --panel:#ffffff;
  --panel-2:#ffffff;
  --border:rgba(20,24,32,.08);
  --text:#17191d;
  --muted:#70757d;
  --red:#d71920;
  --red-hover:#b9141a;
  --green:#198754;
  --amber:#d99000;
  --shadow:0 10px 30px rgba(18,24,40,.07);
  --shadow-soft:0 4px 16px rgba(18,24,40,.05);
}

html{
  background:var(--bg);
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 50% -10%, rgba(215,25,32,.06), transparent 32%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
}

header{
  max-width:760px;
  padding:24px 20px 0;
}

.wordmark{
  font-size:30px;
  letter-spacing:-.045em;
}

.tagline{
  font-size:11px;
  letter-spacing:.04em;
  opacity:.7;
}

.pulse-wrap{
  height:24px;
  margin:16px 0 0;
  opacity:.8;
}

.mode-toggle{
  max-width:760px;
  padding:0 20px;
  margin-top:18px;
  gap:8px;
}

.mode-btn{
  flex:1;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(255,255,255,.75);
  color:var(--muted);
  padding:12px 16px;
  box-shadow:var(--shadow-soft);
  backdrop-filter:blur(12px);
}

.mode-btn.active{
  background:var(--text);
  color:#fff;
  box-shadow:none;
  border-color:var(--text);
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

main{
  max-width:760px;
  padding:0 20px 100px;
}

.surface{
  background:transparent;
  border:0;
  box-shadow:none;
  border-radius:0;
  padding:22px 0;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow-soft);
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

button{
  border-radius:14px;
  min-height:46px;
  font-family:'Inter',sans-serif;
  font-weight:700;
}

input,
select{
  background:#f8f9fb;
  border:1px solid rgba(20,24,32,.10);
  border-radius:13px;
  color:var(--text);
  min-height:46px;
}

input:focus,
select:focus{
  outline:none;
  border-color:rgba(215,25,32,.45);
  box-shadow:0 0 0 4px rgba(215,25,32,.08);
}

.badge{
  border-radius:999px;
  padding:6px 10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.02em;
}

.badge.blood{
  background:rgba(215,25,32,.09);
  color:var(--red);
}

.badge.verified{
  background:rgba(25,135,84,.10);
  color:var(--green);
}

.stat-card{
  border-radius:20px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--shadow-soft);
}

.request-header{
  align-items:center;
}

.request-meta{
  color:var(--muted);
}

@media (max-width:600px){
  header{
    padding:18px 16px 0;
  }

  main{
    padding-left:16px;
    padding-right:16px;
    padding-bottom:90px;
  }

  .mode-toggle{
    padding:0 16px;
  }

  }

<div class="toast" id="toast"></div>

<script>
const API = ""; // same origin

const COMPAT = {
  "O-":["O-"], "O+":["O-","O+"],
  "A-":["O-","A-"], "A+":["O-","O+","A-","A+"],
  "B-":["O-","B-"], "B+":["O-","O+","B-","B+"],
  "AB-":["O-","A-","B-","AB-"], "AB+":["O-","O+","A-","A+","B-","B+","AB-","AB+"]
};
const BLOOD_GROUPS = ["O-","O+","A-","A+","B-","B+","AB-","AB+"];
const DEFAULT_LAT = 12.9716, DEFAULT_LNG = 77.5946; // Bengaluru default for demo

let mode = "donor";

/* Prevent background refresh from rebuilding a request form
   while the hospital is actively filling it. */
window.requestFormDirty = false;

document.addEventListener("input", (event) => {
  if(event.target.closest("#hospitalView #reqHospital, #hospitalView #reqUnits")){
    window.requestFormDirty = true;
  }
});

document.addEventListener("change", (event) => {
  if(event.target.closest("#hospitalView #reqBlood, #hospitalView #reqUrgency")){
    window.requestFormDirty = true;
  }
});
let currentDonorId = localStorage.getItem("hemolink_donor_id") || null;
let cache = { donors: [], requests: [], acceptancesByRequest: {}, donorAcceptances: [] };

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}
function flashPulse(){
  const line = document.querySelector(".pulse-line");
  line.classList.remove("flash"); void line.offsetWidth; line.classList.add("flash");
}
function fmtDate(iso){
  if(!iso) return "â€”";
  const d = new Date(iso+"Z"); // backend sends naive UTC
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function timeRemaining(iso){
  const deadline = new Date(iso+"Z").getTime();
  const diff = deadline - Date.now();
  if(diff <= 0) return "overdue";
  const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
  return `${m}m ${s.toString().padStart(2,'0')}s left`;
}

async function api(path, opts={}){
  const res = await fetch(API+path, {
    headers:{"Content-Type":"application/json"},
    ...opts
  });
  if(!res.ok){
    let detail = "Request failed";
    try{ detail = (await res.json()).detail || detail; }catch(e){}
    throw new Error(detail);
  }
  return res.json();
}

/* =========================================================
   DONOR HEALTH PROFILE
   ========================================================= */

function healthProfileValue(value){
  return value == null ? "" : String(value);
}

async function saveHealthProfile(){
  const donor = cache.donors.find(d => d.id === currentDonorId);

  if(!donor){
    alert("Please select your donor profile first.");
    return;
  }

  const button = document.getElementById("saveHealthProfileBtn");
  const status = document.getElementById("healthProfileStatus");

  if(!button){
    console.error("Save button not found.");
    return;
  }

  const payload = {
    smoking_tobacco: document.getElementById("healthSmoking").checked,
    alcohol_use: document.getElementById("healthAlcohol").checked,
    previous_illnesses: document.getElementById("healthIllnesses").value.trim() || null,
    diseases: document.getElementById("healthDiseases").value.trim() || null,
    medications: document.getElementById("healthMedications").value.trim() || null,
    medical_history: document.getElementById("healthHistory").value.trim() || null
  };

  try{
    button.disabled = true;
    button.textContent = "Saving...";

    if(status){
      status.textContent = "Saving health profile...";
      status.className = "health-profile-status";
    }

    const updated = await api(
      `/donors/${encodeURIComponent(currentDonorId)}/health-profile`,
      {
        method:"PUT",
        body:JSON.stringify(payload)
      }
    );

    const index = cache.donors.findIndex(d => d.id === currentDonorId);

    if(index !== -1){
      cache.donors[index] = updated;
    }

    button.disabled = false;
    button.textContent = "Save health profile";

    if(status){
      status.textContent = "✓ Health profile saved successfully";
      status.className = "health-profile-status success";
    }

    toast("Health profile saved successfully.");

  }catch(error){
    console.error("Health profile update failed:", error);

    button.disabled = false;
    button.textContent = "Save health profile";

    if(status){
      status.textContent = error.message || "Unable to save health profile.";
      status.className = "health-profile-status error";
    }

    toast("Unable to save health profile.");
  }
}
function setMode(m){
  mode = m;
  document.getElementById("tabDonor").classList.toggle("active", m==="donor");
  document.getElementById("tabHospital").classList.toggle("active", m==="hospital");
  document.getElementById("donorView").style.display = m==="donor" ? "block":"none";
  document.getElementById("hospitalView").style.display = m==="hospital" ? "block":"none";
  window.justSwitchedMode = true;
  refreshAll();
}

async function refreshAll(){
  try{
    cache.donors = await api("/donors/");
    cache.requests = await api("/requests/");
    if(currentDonorId){
      cache.donorAcceptances = await api(`/acceptances/donor/${currentDonorId}`);
    }
    for(const r of cache.requests){
      cache.acceptancesByRequest[r.id] = await api(`/requests/${r.id}/acceptances`);
    }
  }catch(e){ console.error(e); }

  // Don't blow away a form the person is actively typing into â€” skip this
  // Never rebuild the active view while the user is interacting with it.
  // API data still refreshes in the background every 5 seconds.
  const active = document.activeElement;
  const activeView = mode === "donor"
    ? document.getElementById("donorView")
    : document.getElementById("hospitalView");

  const interacting =
    activeView &&
    (
      activeView.contains(active) ||
      active?.closest("button") ||
      active?.closest("select") ||
      active?.closest("input") ||
      active?.closest("textarea")
    );

  if(interacting && !window.justSwitchedMode) return;

  /* Never destroy a hospital request form that the user has started filling. */
  if(mode==="hospital" && window.requestFormDirty && !window.justSwitchedMode){
    return;
  }

  if(mode==="donor") renderDonorView();
  else renderHospitalView();

  /* Mode switch has now been handled. */
  window.justSwitchedMode = false;
}

                ? `<span class="badge urgent-critical">Priority</span>`
                : ""
              }

            </div>

            <div class="hospital-request-meta">

              <span>
                🩸 ${r.blood_group_needed}
              </span>

              <span>
                📦 ${r.units_needed}
                unit${r.units_needed > 1 ? "s" : ""}
              </span>

              <span>
                📍 ${r.current_radius_km}km radius
              </span>

              <span>
                🕒 ${fmtDate(r.created_at)}
              </span>

            </div>

            ${
              accs.length === 0

              ? `
                <div class="hospital-empty" style="padding:22px 10px 5px;">
                  No donors have accepted yet.
                </div>
              `

              :

              `
                <div class="hospital-request-donors">

                  ${
                    accs.map(a => {

                      const d =
                        cache.donors.find(x => x.id === a.donor_id);

                      const name =
                        d ? d.name : a.donor_id.slice(0,8);

                      return `

                        <div class="hospital-donor-row">

                          <div class="hospital-donor-main">

                            <div class="hospital-donor-avatar">
                              ${donorInitials(name)}
                            </div>

                            <div>
                              <div class="hospital-donor-name">
                                ${name}
                              </div>

                              <div class="hospital-donor-phone">
                                ${d ? d.phone : ""}
                              </div>
                            </div>

                          </div>

                          <div class="hospital-donor-actions">

                            <span class="badge status-${a.status}">
                              ${a.status.replace("_"," ")}
                            </span>

                            <button
                              class="small secondary"
                              onclick="toggleDonorHealth('${a.id}')"
                            >
                              View health profile
                            </button>

                            ${
                              a.status === "pending"
                              ? `
                                <button
                                  class="small"
                                  onclick="fulfillAcceptance('${a.id}')"
                                >
                                  Mark fulfilled
                                </button>
                              `
                              : ""
                            }

                          </div>

                          <div
                            id="health-${a.id}"
                            class="hospital-donor-health"
                            style="display:none;"
                          >

                            <div class="hospital-health-title">
                              Donor health profile
                            </div>

                            ${
                              d
                              ? `
                                <div class="hospital-health-grid">

                                  <div>
                                    <span>Smoking / tobacco</span>
                                    <strong>${d.smoking_tobacco ? `<span class="health-positive">Yes</span>` : `<span class="health-clear">No</span>`}</strong>
                                  </div>

                                  <div>
                                    <span>Alcohol use</span>
                                    <strong>${d.alcohol_use ? `<span class="health-positive">Yes</span>` : `<span class="health-clear">No</span>`}</strong>
                                  </div>

                                  <div>
                                    <span>Previous illnesses</span>
                                    <strong>${d.previous_illnesses || `<span class="health-clear">None reported</span>`}</strong>
                                  </div>

                                  <div>
                                    <span>Diseases</span>
                                    <strong>${d.diseases || `<span class="health-clear">None reported</span>`}</strong>
                                  </div>

                                  <div>
                                    <span>Medications</span>
                                    <strong>${d.medications || `<span class="health-clear">None reported</span>`}</strong>
                                  </div>

                                  <div>
                                    <span>Medical history</span>
                                    <strong>${d.medical_history || `<span class="health-clear">None reported</span>`}</strong>
                                  </div>

                                </div>

                                <div class="hospital-health-updated">
                                  ${
                                    d.health_profile_updated_at
                                      ? "Last updated: " + new Date(d.health_profile_updated_at).toLocaleString()
                                      : "Health profile not updated yet"
                                  }
                                </div>
                              `
                              : `
                                <div class="hospital-empty">
                                  Donor health profile unavailable.
                                </div>
                              `
                            }

                          </div>

                        </div>

                      `;

                    }).join("")
                  }

                </div>
              `
            }

          </div>

        `;

      }).join("")
    }

    <!-- DONOR POOL -->
    <div class="hospital-section-head">
      <h3>Donor pool</h3>
      <span>${cache.donors.length} registered</span>
    </div>

    ${
      cache.donors.length === 0

      ? `
        <div class="card hospital-empty">
          <div class="hospital-empty-icon">👥</div>
          No donors registered yet.
        </div>
      `

      :

      cache.donors.map(d => {

        const initials =
          donorInitials(d.name);

        return `

          <div class="card hospital-donor-card">

            <div class="hospital-donor-main">

              <div class="hospital-donor-avatar">
                ${initials}
              </div>

              <div class="hospital-donor-info">

                <strong>${d.name}</strong>

                <small>
                  ${d.phone}
                  ·
                  ${d.total_donations} donation${d.total_donations !== 1 ? "s" : ""}
                  ·
                  reliability ${Math.round(d.reliability_score)}/100
                </small>

                <div style="margin-top:7px;">

                  <span class="badge blood">
                    ${d.blood_group}
                  </span>

                  ${
                    d.is_verified
                    ? '<span class="badge verified">✓ Verified</span>'
                    : '<span class="badge">Unverified</span>'
                  }

                  ${
                    d.is_suspended
                    ? '<span class="badge urgent-critical">Suspended</span>'
                    : ''
                  }

                </div>

              </div>

            </div>

            <div class="hospital-donor-actions">

              ${
                (!d.is_verified && d.total_donations > 0)
                ? `
                  <button
                    class="small secondary"
                    onclick="verifyDonor('${d.id}')"
                  >
                    Verify donor
                  </button>
                `
                : ""
              }

            </div>

          </div>

        `;

      }).join("")
    }

  `;

  setTimeout(()=>initRequestMap(),100);
}
function toggleDonorHealth(acceptanceId){
  const panel = document.getElementById("health-" + acceptanceId);

  if(!panel) return;

  const isOpen = panel.style.display !== "none";

  panel.style.display = isOpen ? "none" : "block";
}
async function createRequest(){
 const hospital_name = document.getElementById("reqHospital").value.trim();
  const blood_group_needed = document.getElementById("reqBlood").value;
  const units_needed = parseInt(document.getElementById("reqUnits").value) || 1;
  const urgency = document.getElementById("reqUrgency").value;
  const locEl = document.getElementById("reqLoc");
  const latitude = parseFloat(locEl.dataset.lat || DEFAULT_LAT);
  const longitude = parseFloat(locEl.dataset.lng || DEFAULT_LNG);
  if(!hospital_name){ toast("Enter the hospital name"); return; }
  try{
    await api("/requests/", {method:"POST", body:JSON.stringify({
      hospital_name, blood_group_needed, units_needed, urgency, latitude, longitude, eta_window_minutes:45
    })});
    toast("Request created â€” matching donors now");
    flashPulse();

    /* Request submitted successfully, so the form can be rebuilt. */
    window.requestFormDirty = false;

    await refreshAll();
  }catch(e){ toast(e.message); }
}

async function fulfillAcceptance(acceptanceId){
  try{
    await api(`/acceptances/${acceptanceId}/fulfill`, {method:"POST"});
    toast("Marked fulfilled â€” donor rewarded, others stood down");
    flashPulse();
    await refreshAll();
  }catch(e){ toast(e.message); }
}

async function verifyDonor(donorId){
  try{
    await api(`/donors/${donorId}/verify`, {method:"POST"});
    toast("Donor verified");
    await refreshAll();
  }catch(e){ toast(e.message); }
}

/* ============== INIT ============== */
refreshAll();
setInterval(async () => {
  try {
    cache.donors = await api("/donors/");
    cache.requests = await api("/requests/");

    // Background data refresh only.
    // Do not rebuild the active Donor/Hospital form here.
    // Re-rendering destroys values currently being entered.

  }catch(e){
    console.error("Background refresh failed:", e);
  }
}, 5000);

// Updates just the countdown timer's text every second, without touching
// the rest of the page (so it never interrupts typing in a form field).
setInterval(()=>{
  const timerEl = document.getElementById("etaTimer");
  if(timerEl){
    timerEl.textContent = timeRemaining(timerEl.dataset.deadline);
  }
}, 1000);
</script>
</body>
</html>
