<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HemoLink — Blood Donor Matching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>
<style>
  :root{
    --bg:#161616;
    --panel:#1e1e1e;
    --panel-2:#232323;
    --border:rgba(255,255,255,0.08);
    --text:#f5f3ef;
    --muted:#8a8d91;
    --red:#c1121f;
    --red-hover:#e0182a;
    --green:#2d8b5f;
    --amber:#e0a82e;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--red);color:#fff;}

  /* ---------- Header ---------- */
  header{
    padding:32px 24px 0;
    max-width:920px;
    margin:0 auto;
  }
  .wordmark{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:clamp(28px,5vw,40px);
    letter-spacing:-0.02em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .wordmark span.dot{color:var(--red);}
  .tagline{
    color:var(--muted);
    font-size:14px;
    margin-top:4px;
    font-family:var(--mono);
  }
  .pulse-wrap{
    margin:20px 0 0;
    height:36px;
    overflow:hidden;
  }
  .pulse-wrap svg{width:100%;height:100%;display:block;}
  .pulse-line{
    fill:none;
    stroke:var(--red);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:1400;
    stroke-dashoffset:1400;
    animation:draw 2.4s ease-out forwards;
  }
  @keyframes draw{ to{stroke-dashoffset:0;} }
  .pulse-line.flash{animation:draw 0.9s ease-out;}

  /* ---------- Mode toggle ---------- */
  .mode-toggle{
    display:flex;
    gap:6px;
    max-width:920px;
    margin:8px auto 0;
    padding:0 24px;
  }
  .mode-btn{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:12px 22px 10px;
    background:var(--panel);
    color:var(--muted);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    transition:color .15s, background .15s;
  }
  .mode-btn.active{
    background:var(--panel-2);
    color:var(--text);
    box-shadow:inset 0 2px 0 var(--red);
  }
  .mode-btn:hover:not(.active){color:var(--text);}

  main{
    max-width:920px;
    margin:0 auto;
    padding:0 24px 80px;
  }
  .surface{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:0 12px 12px 12px;
    padding:28px;
  }

  h2{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:18px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .section-note{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){ .grid-2{grid-template-columns:1fr;} }
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:24px;
}

.stat-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
}

.request-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
  font-size:12px;
  color:var(--muted);
}

.request-meta span{
  background:#141414;
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 9px;
}
.stat-value{
  font-family:'Archivo',sans-serif;
  font-size:24px;
  font-weight:800;
  margin-bottom:4px;
}

.stat-label{
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.05em;
}

@media (max-width:640px){
  .stats-grid{
    grid-template-columns:1fr 1fr;
  }
}

  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
    font-weight:500;
  }
  input,select{
    width:100%;
    background:#141414;
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:7px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    margin-bottom:14px;
  }
  input:focus,select:focus{
    outline:none;
    border-color:var(--red);
  }
  button{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.02em;
    background:var(--red);
    color:#fff;
    border:none;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s;
  }
  button:hover{background:var(--red-hover);}
  button:disabled{background:#3a3a3a;color:#777;cursor:not-allowed;}
  button.secondary{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  button.secondary:hover{border-color:var(--red);background:transparent;}
  button.small{padding:6px 12px;font-size:11px;}

  .badge{
    display:inline-flex;
    align-items:center;
    font-family:var(--mono);
    font-size:11px;
    padding:3px 9px;
    border-radius:20px;
    border:1px solid var(--border);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .badge.blood{background:rgba(193,18,31,0.15);color:#ff6b74;border-color:rgba(193,18,31,0.4);}
  .badge.urgent-critical{
  background:rgba(193,18,31,0.25);
  color:#ff6b74;
  border-color:var(--red);
  font-weight:700;
  box-shadow:0 0 10px rgba(193,18,31,0.15);
}

.badge.urgent-urgent{
  background:rgba(224,168,46,0.15);
  color:var(--amber);
  border-color:rgba(224,168,46,0.4);
  font-weight:700;
}

.badge.urgent-standard{
  background:rgba(138,141,145,0.15);
  color:var(--muted);
  border-color:rgba(138,141,145,0.3);
}
  .badge.status-open{color:var(--amber);border-color:rgba(224,168,46,0.4);}
  .badge.status-matching{color:#ffb3b8;border-color:var(--red);}
  .badge.status-fulfilled{color:var(--green);border-color:rgba(45,139,95,0.4);}
  .badge.status-pending{color:var(--amber);border-color:rgba(224,168,46,0.4);}
  .badge.status-stood_down{color:var(--muted);}
  .badge.status-no_show{color:#ff6b74;border-color:var(--red);}
  .badge.verified{color:var(--green);border-color:rgba(45,139,95,0.4);background:rgba(45,139,95,0.12);}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .muted{color:var(--muted);}
  .mono{font-family:var(--mono);}
  .empty{
    color:var(--muted);
    font-size:13px;
    padding:20px;
    text-align:center;
    border:1px dashed var(--border);
    border-radius:8px;
  }
  .profile-score{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:32px;
    color:var(--text);
  }
  .score-bar{
    height:6px;
    background:#141414;
    border-radius:3px;
    overflow:hidden;
    margin-top:8px;
  }
  .score-bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--red),var(--amber));
    transition:width .3s;
  }
  .switch-link{
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
  }
  .switch-link:hover{color:var(--text);}
  .timer{
    font-family:var(--mono);
    font-size:13px;
    color:var(--amber);
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--panel-2);
    border:1px solid var(--red);
    color:var(--text);
    padding:12px 20px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
/* =========================================================
   REDSYNC — VISUAL UPGRADE 01
   Safe UI-only styling
   ========================================================= */

:root{
  --bg:#0b0d10;
  --panel:#12161b;
  --panel-2:#171c22;
  --panel-3:#1c2229;
  --border:rgba(255,255,255,.09);
  --border-hover:rgba(255,255,255,.16);
  --text:#f7f7f5;
  --muted:#9299a3;
  --red:#d7192d;
  --red-hover:#ef263b;
  --green:#35a56f;
  --amber:#e4aa32;
  --shadow:0 14px 40px rgba(0,0,0,.28);
}

/* ---------- Overall surface ---------- */

body{
  background:
    radial-gradient(circle at 50% -10%, rgba(215,25,45,.08), transparent 38%),
    var(--bg);
}

header{
  padding-top:38px;
}

/* ---------- RedSync branding area ---------- */

.wordmark{
  font-size:clamp(30px,5vw,44px);
  letter-spacing:-.045em;
  line-height:1;
}

.wordmark span.dot{
  color:var(--red);
  text-shadow:0 0 18px rgba(215,25,45,.35);
}

.tagline{
  margin-top:8px;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.8;
}

/* ---------- ECG line ---------- */

.pulse-wrap{
  margin-top:24px;
  height:42px;
  opacity:.9;
}

.pulse-line{
  stroke:var(--red);
  stroke-width:2.2;
  filter:drop-shadow(0 0 5px rgba(215,25,45,.35));
}

/* ---------- Donor / Hospital navigation ---------- */

.mode-toggle{
  margin-top:18px;
  gap:8px;
}

.mode-btn{
  position:relative;
  padding:12px 24px 11px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-bottom:1px solid var(--border);
  border-radius:9px 9px 0 0;
  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.mode-btn:hover:not(.active){
  background:rgba(255,255,255,.05);
  border-color:var(--border-hover);
  transform:translateY(-1px);
}

.mode-btn.active{
  background:var(--panel-2);
  color:#fff;
  border-color:var(--border);
  box-shadow:
    inset 0 2px 0 var(--red),
    0 -4px 18px rgba(215,25,45,.06);
}

/* ---------- Main application surface ---------- */

.surface{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.018),
      rgba(255,255,255,.006)
    ),
    var(--panel-2);
  border:1px solid var(--border);
  border-radius:0 14px 14px 14px;
  padding:30px;
  box-shadow:var(--shadow);
}

/* ---------- Cards ---------- */

.card,
.stat-card{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.018),
      transparent
    ),
    var(--panel);
  border-color:var(--border);
  box-shadow:0 8px 24px rgba(0,0,0,.14);
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.card:hover,
.stat-card:hover{
  border-color:var(--border-hover);
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}

/* ---------- Section headings ---------- */

h2{
  font-size:20px;
  letter-spacing:-.025em;
}

.section-note{
  line-height:1.6;
}

/* ---------- Inputs ---------- */

input,
select{
  background:#0e1115;
  border-color:rgba(255,255,255,.10);
  min-height:42px;
  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input:hover,
select:hover{
  border-color:rgba(255,255,255,.16);
}

input:focus,
select:focus{
  background:#101419;
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(215,25,45,.10);
}

/* ---------- Buttons ---------- */

button{
  background:var(--red);
  border-radius:8px;
  min-height:40px;
  box-shadow:0 5px 14px rgba(215,25,45,.12);
  transition:
    background .2s ease,
    transform .15s ease,
    box-shadow .2s ease;
}

button:hover:not(:disabled){
  background:var(--red-hover);
  transform:translateY(-1px);
  box-shadow:0 7px 18px rgba(215,25,45,.20);
}

button:active:not(:disabled){
  transform:translateY(0);
}

button.secondary{
  background:rgba(255,255,255,.025);
  border-color:var(--border);
  box-shadow:none;
}

button.secondary:hover{
  background:rgba(255,255,255,.055);
  border-color:rgba(215,25,45,.55);
}

/* ---------- Statistics ---------- */

.stats-grid{
  gap:12px;
}

.stat-card{
  position:relative;
  overflow:hidden;
}

.stat-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:3px;
  height:100%;
  background:var(--red);
  opacity:.75;
}

.stat-value{
  font-size:27px;
}

.stat-label{
  font-size:10px;
  letter-spacing:.08em;
}

/* ---------- Badges ---------- */

.badge{
  font-size:10px;
  padding:4px 9px;
  font-weight:600;
}

.badge.blood{
  box-shadow:0 0 12px rgba(193,18,31,.08);
}

/* ---------- Responsive ---------- */

@media(max-width:640px){

  header{
    padding-top:26px;
  }

  main{
    padding-left:14px;
    padding-right:14px;
  }

  .mode-toggle{
    padding-left:14px;
    padding-right:14px;
  }

  .surface{
    padding:20px 16px;
    border-radius:0 12px 12px 12px;
  }

  .mode-btn{
    flex:1;
    padding-left:12px;
    padding-right:12px;
  }

  .stats-grid{
    gap:8px;
  }

  .stat-card{
    padding:13px;
  }

  .stat-value{
    font-size:23px;
  }
}
/* =========================================================
   REDSYNC — VISUAL UPGRADE 02
   Dashboard + request cards
   ========================================================= */

/* ---------- Dashboard spacing ---------- */

#donorView,
#hospitalView{
  animation:none;
}

@keyframes fadeInView{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ---------- Cards ---------- */

.card{
  position:relative;
  overflow:hidden;
}

.card::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(
    90deg,
    rgba(215,25,45,.55),
    transparent 70%
  );
  opacity:.45;
}

/* ---------- Request metadata ---------- */

.request-meta{
  gap:7px;
  margin-top:14px;
}

.request-meta span{
  background:rgba(255,255,255,.025);
  border-color:rgba(255,255,255,.08);
  border-radius:7px;
  padding:6px 9px;
  transition:background .2s ease,border-color .2s ease;
}

.request-meta span:hover{
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.14);
}

/* ---------- Blood badges ---------- */

.badge.blood{
  font-size:12px;
  font-weight:800;
  padding:5px 11px;
  letter-spacing:.04em;
}

/* ---------- Critical requests ---------- */

.badge.urgent-critical{
  box-shadow:
    0 0 0 1px rgba(215,25,45,.08),
    0 0 18px rgba(215,25,45,.13);
  animation:criticalGlow 2s ease-in-out infinite;
}

@keyframes criticalGlow{
  0%,100%{
    box-shadow:
      0 0 0 1px rgba(215,25,45,.08),
      0 0 12px rgba(215,25,45,.08);
  }
  50%{
    box-shadow:
      0 0 0 1px rgba(215,25,45,.16),
      0 0 20px rgba(215,25,45,.18);
  }
}

/* ---------- Profile score ---------- */

.profile-score{
  font-size:36px;
  letter-spacing:-.04em;
}

.score-bar{
  height:7px;
  background:#0d1013;
  border:1px solid rgba(255,255,255,.04);
}

.score-bar-fill{
  background:linear-gradient(
    90deg,
    var(--red),
    var(--amber)
  );
  box-shadow:0 0 10px rgba(215,25,45,.20);
}

/* ---------- Empty states ---------- */

.empty{
  background:rgba(255,255,255,.012);
  border-color:rgba(255,255,255,.10);
  line-height:1.6;
}

/* ---------- Timers ---------- */

.timer{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:600;
}

.timer::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 8px currentColor;
}

/* ---------- Verified badge ---------- */

.badge.verified{
  font-weight:600;
  box-shadow:0 0 12px rgba(53,165,111,.07);
}

/* ---------- Rows ---------- */

.row{
  row-gap:10px;
}

/* ---------- Links ---------- */

.switch-link{
  transition:color .2s ease;
}

.switch-link:hover{
  color:#fff;
}

/* ---------- Toast ---------- */

.toast{
  background:rgba(18,22,27,.96);
  backdrop-filter:blur(12px);
  border-color:rgba(215,25,45,.55);
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

/* ---------- Mobile request layout ---------- */

@media(max-width:640px){

  .request-meta span{
    font-size:11px;
    padding:5px 8px;
  }

  .profile-score{
    font-size:31px;
  }

  .card{
    padding:16px;
  }

}
/* =========================================================
   REDSYNC — VISUAL UPGRADE 03
   Donor registration / onboarding
   ========================================================= */

#donorView > h2{
  font-size:clamp(24px,4vw,32px);
  letter-spacing:-.035em;
  margin-bottom:8px;
}

#donorView > .section-note{
  max-width:560px;
  font-size:13px;
  margin-bottom:26px;
}

/* Registration cards */

#donorView .grid-2{
  align-items:stretch;
  gap:18px;
}

#donorView .grid-2 > .card{
  padding:22px;
}

/* First card — registration */

#donorView .grid-2 > .card:first-child{
  border-color:rgba(215,25,45,.16);
  box-shadow:
    0 12px 35px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(215,25,45,.08);
}

/* Second card — existing donor */

#donorView .grid-2 > .card:nth-child(2){
  background:#11151a;
}

/* Form labels */

#donorView label{
  font-size:11px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  margin-bottom:7px;
}

/* Form fields */

#donorView input,
#donorView select{
  min-height:44px;
  margin-bottom:17px;
}

/* Location row */

#donorView .grid-2 > .card:first-child .row{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.07);
  border-radius:9px;
  padding:10px;
  margin-bottom:16px !important;
}

#regLoc{
  line-height:1.4;
}

/* Main registration button */

#donorView .grid-2 > .card:first-child button:not(.secondary){
  width:100%;
  min-height:44px;
  margin-top:3px;
  font-size:13px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

/* Existing donor lookup */

#donorView .grid-2 > .card:nth-child(2) label{
  margin-bottom:8px;
}

#donorView .grid-2 > .card:nth-child(2) button{
  width:100%;
  min-height:42px;
}

/* Registered donor count */

#donorView .grid-2 > .card:nth-child(2) p{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.06);
  border-radius:8px;
  padding:10px 12px;
}

/* Mobile */

@media(max-width:640px){

  #donorView > h2{
    font-size:25px;
  }

  #donorView .grid-2{
    gap:12px;
  }

  #donorView .grid-2 > .card{
    padding:18px;
  }

}
/* =========================================================
   REDSYNC — VISUAL UPGRADE 04
   Donor dashboard
   ========================================================= */

/* ---------- Donor dashboard headings ---------- */

#donorView h2{
  font-size:clamp(22px,4vw,30px);
  letter-spacing:-.035em;
}

#donorView .section-note{
  line-height:1.6;
}

/* ---------- Donor profile area ---------- */

#donorView .card:first-child{
  position:relative;
  overflow:hidden;
}

#donorView .card:first-child::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:2px;
  background:linear-gradient(

<body>

<header>
  <div class="wordmark">HEMOLINK<span class="dot">.</span></div>
  <div class="tagline">// live blood donor matching</div>
  <div class="pulse-wrap">
    <svg id="pulseSvg" viewBox="0 0 700 40" preserveAspectRatio="none">
      <path class="pulse-line" d="M0,20 L120,20 L145,20 L160,4 L178,36 L196,20 L230,20 L700,20" />
    </svg>
  </div>
</header>

<div class="mode-toggle">
  <button class="mode-btn active" id="tabDonor" onclick="setMode('donor')">Donor</button>
  <button class="mode-btn" id="tabHospital" onclick="setMode('hospital')">Hospital</button>
</div>

<main>
  <div class="surface" id="donorView"></div>
  <div class="surface" id="hospitalView" style="display:none;"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = ""; // same origin

const COMPAT = {
  "O-":["O-"], "O+":["O-","O+"],
  "A-":["O-","A-"], "A+":["O-","O+","A-","A+"],
  "B-":["O-","B-"], "B+":["O-","O+","B-","B+"],
  "AB-":["O-","A-","B-","AB-"], "AB+":["O-","O+","A-","A+","B-","B+","AB-","AB+"]
};
const BLOOD_GROUPS = ["O-","O+","A-","A+","B-","B+","AB-","AB+"];
const DEFAULT_LAT = 12.9716, DEFAULT_LNG = 77.5946; // Bengaluru default for demo

let mode = "donor";
let currentDonorId = localStorage.getItem("hemolink_donor_id") || null;
let cache = { donors: [], requests: [], acceptancesByRequest: {}, donorAcceptances: [] };

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}
function flashPulse(){
  const line = document.querySelector(".pulse-line");
  line.classList.remove("flash"); void line.offsetWidth; line.classList.add("flash");
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"Z"); // backend sends naive UTC
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function timeRemaining(iso){
  const deadline = new Date(iso+"Z").getTime();
  const diff = deadline - Date.now();
  if(diff <= 0) return "overdue";
  const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
  return `${m}m ${s.toString().padStart(2,'0')}s left`;
}

async function api(path, opts={}){
  const res = await fetch(API+path, {
    headers:{"Content-Type":"application/json"},
    ...opts
  });
  if(!res.ok){
    let detail = "Request failed";
    try{ detail = (await res.json()).detail || detail; }catch(e){}
    throw new Error(detail);
  }
  return res.json();
}

function setMode(m){
  mode = m;
  document.getElementById("tabDonor").classList.toggle("active", m==="donor");
  document.getElementById("tabHospital").classList.toggle("active", m==="hospital");
  document.getElementById("donorView").style.display = m==="donor" ? "block":"none";
  document.getElementById("hospitalView").style.display = m==="hospital" ? "block":"none";
  refreshAll();
}

async function refreshAll(){
  try{
    cache.donors = await api("/donors/");
    cache.requests = await api("/requests/");
    if(currentDonorId){
      cache.donorAcceptances = await api(`/acceptances/donor/${currentDonorId}`);
    }
    for(const r of cache.requests){
      cache.acceptancesByRequest[r.id] = await api(`/requests/${r.id}/acceptances`);
    }
  }catch(e){ console.error(e); }

  // Don't blow away a form the person is actively typing into — skip this
  // Never rebuild the active view while the user is interacting with it.
  // API data still refreshes in the background every 5 seconds.
  const active = document.activeElement;
  const activeView = mode === "donor"
    ? document.getElementById("donorView")
    : document.getElementById("hospitalView");

  const interacting =
    activeView &&
    (
      activeView.contains(active) ||
      active?.closest("button") ||
      active?.closest("select") ||
      active?.closest("input") ||
      active?.closest("textarea")
    );

  if(interacting) return;

  if(mode==="donor") renderDonorView();
  else renderHospitalView();
}

/* ============== DONOR VIEW ============== */

function renderDonorView(){
  const el = document.getElementById("donorView");
  const donor = cache.donors.find(d=>d.id===currentDonorId);

  if(!donor){
    el.innerHTML = `
      <h2>Register as a donor</h2>
      <p class="section-note">Or, if you've already registered, look yourself up by phone.</p>
      <div class="grid-2">
        <div class="card">
          <label>Full name</label>
          <input id="regName" placeholder="e.g. Ananya Rao" />
          <label>Phone number</label>
          <input id="regPhone" placeholder="e.g. 9876543210" />
          <label>Blood group</label>
          <select id="regBlood">${BLOOD_GROUPS.map(b=>`<option>${b}</option>`).join("")}</select>
          <label>Location</label>
          <div class="row" style="margin-bottom:14px;">
            <span class="mono muted" style="font-size:12px;" id="regLoc">${DEFAULT_LAT.toFixed(4)}, ${DEFAULT_LNG.toFixed(4)} (default)</span>
            <button class="secondary small" onclick="useMyLocation('reg')">Use my location</button>
          </div>
          <button onclick="registerDonor()">Register</button>
        </div>
        <div class="card">
          <label>Find your profile by phone</label>
          <input id="lookupPhone" placeholder="Enter phone number" />
          <button class="secondary" onclick="lookupDonor()">Find me</button>
          <p class="muted" style="font-size:12px;margin-top:14px;">Registered donors: ${cache.donors.length}</p>
        </div>
      </div>
    `;
    el._regLat = DEFAULT_LAT; el._regLng = DEFAULT_LNG;
    return;
  }

  const compatibleRequests = cache.requests.filter(r =>
    (r.status==="open" || r.status==="matching") &&
    COMPAT[r.blood_group_needed].includes(donor.blood_group)
  );

  const myPending = cache.donorAcceptances.find(a=>a.status==="pending");
  const myHistory = cache.donorAcceptances.filter(a=>a.status!=="pending");

  el.innerHTML = `
    <div class="row" style="margin-bottom:18px;">
      <div>
        <h2 style="margin-bottom:2px;">${donor.name}</h2>
        <span class="mono muted" style="font-size:12px;">${donor.phone}</span>
      </div>
      <span class="switch-link" onclick="switchDonor()">Not you? Switch profile</span>
    </div>

    <div class="card row" style="align-items:flex-start;">
      <div>
        <span class="badge blood">${donor.blood_group}</span>
        ${donor.is_verified ? '<span class="badge verified">✓ verified</span>' : '<span class="badge">unverified</span>'}
        ${donor.is_suspended ? '<span class="badge urgent-critical">suspended</span>' : ''}
        <div style="margin-top:14px;">
   <div class="mono muted" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;">
  Donor status
</div>      
 <div class="profile-score">${Math.round(donor.reliability_score)}<span class="muted" style="font-size:14px;">/100</span></div>
          <div class="score-bar"><div class="score-bar-fill" style="width:${donor.reliability_score}%"></div></div>
          <p class="muted" style="font-size:12px;margin-top:6px;">reliability score</p>
        </div>
      </div>
      <div class="muted" style="font-size:13px;text-align:right;">
        <div>${donor.total_donations} donation${donor.total_donations!==1?'s':''}</div>
        <div>${donor.total_no_shows} no-show${donor.total_no_shows!==1?'s':''}</div>
        <div>${donor.is_available ? '🟢 available' : '⚪ not available'}</div>
      </div>
    </div>

    ${myPending ? `
      <div class="card" style="border-color:var(--red);">
        <div class="row">
          <div>
            <span class="badge status-pending">pending — you accepted</span>
            <p style="margin:8px 0 0;font-size:13px;">Head to the hospital to complete your donation.</p>
          </div>
          <div class="timer" id="etaTimer" data-deadline="${myPending.eta_deadline}">${timeRemaining(myPending.eta_deadline)}</div>
        </div>
      </div>
    ` : ""}

    <h2 style="margin-top:24px;">Requests you can help with</h2>
   <p class="section-note">Matched to your blood group (${donor.blood_group}), nearest tier first.</p>
    ${compatibleRequests.length===0 ? `<div class="empty">No open requests match your blood group right now.</div>` :
      compatibleRequests.map(r=>{
       const already = cache.donorAcceptances.find(
  a => a.request_id === r.id && a.status === "pending"
);

return `
  <div class="card row">
    <div>
      <strong>${r.hospital_name}</strong>
      <span class="badge urgent-${r.urgency}">${r.urgency}</span>
      <span class="badge status-${r.status}">${r.status}</span>
      <div class="muted mono" style="font-size:12px;margin-top:8px;">
        needs ${r.blood_group_needed} · ${r.units_needed} unit(s) · within ${r.current_radius_km}km
      </div>
    </div>

    ${
      already
        ? `<span class="badge status-pending">you accepted</span>`
        : (donor.is_suspended || !donor.is_available || myPending)
          ? `<button disabled>${myPending ? "busy" : "unavailable"}</button>`
          : `<button onclick="acceptRequest('${r.id}')">Accept</button>`
    }
  </div>
`;
}).join("")
    }

    ${myHistory.length>0 ? `
      <h2 style="margin-top:24px;">Your history</h2>
      ${myHistory.map(a=>`
        <div class="card row">
          <span class="mono muted" style="font-size:12px;">accepted ${fmtDate(a.accepted_at)}</span>
          <span class="badge status-${a.status}">${a.status.replace('_',' ')}</span>
        </div>
      `).join("")}
    ` : ""}
  `;
}

function useMyLocation(prefix){
  if(!navigator.geolocation){
    toast("Geolocation not available");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    const locEl = document.getElementById(prefix+"Loc");

    locEl.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)} (live)`;
    locEl.dataset.lat = lat;
    locEl.dataset.lng = lng;

    /* Update the Hospital request map when GPS changes */
    if(prefix === "req" && window.requestMapInstance){
      const map = window.requestMapInstance;

      map.setView([lat, lng], 13);

      map.eachLayer(layer=>{
        if(layer instanceof L.Circle){
          layer.setLatLng([lat, lng]);
        }
      });
    }

  }, ()=>{
    toast("Couldn't get location — using default");
  });
}function initRequestMap(){
  const mapEl = document.getElementById("requestMap");
  const locEl = document.getElementById("reqLoc");

  if(!mapEl || !locEl || typeof L === "undefined") return;

  const lat = parseFloat(locEl.dataset.lat) || DEFAULT_LAT;
  const lng = parseFloat(locEl.dataset.lng) || DEFAULT_LNG;

  if(window.requestMapInstance){
    window.requestMapInstance.remove();
  }

  const map = L.map("requestMap").setView([lat, lng], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
const bloodIcon = L.divIcon({
  className: "blood-request-marker",
  html: `
    <div class="blood-pin">
      <div class="blood-pin-icon">🩸</div>
    </div>
  `,
  iconSize: [48, 58],
  iconAnchor: [24, 58],
  popupAnchor: [0, -52]
});const hospitalName = document.getElementById("reqHospital")?.value.trim() || "Hospital";
const bloodGroup = document.getElementById("reqBlood")?.value || "—";
const units = document.getElementById("reqUnits")?.value || "1";
const urgency = document.getElementById("reqUrgency")?.value || "urgent";

const popupContent = `
  <div style="min-width:240px;font-family:Inter,sans-serif;">

    <div style="
      font-size:16px;
      font-weight:800;
      margin-bottom:10px;
      color:#c1121f;
    ">
      🩸 Blood Request
    </div>

    <div style="margin-bottom:6px;">
      🏥 <strong>${hospitalName}</strong>
    </div>

    <div style="margin-bottom:6px;">
      🩸 Blood Group:
      <strong>${bloodGroup}</strong>
    </div>

    <div style="margin-bottom:6px;">
      📦 Units Required:
      <strong>${units}</strong>
    </div>

    <div style="margin-bottom:6px;">
      ⚠️ Urgency:
      <strong>${urgency.toUpperCase()}</strong>
    </div>

    <div style="
      margin-top:10px;
      padding-top:8px;
      border-top:1px solid #ddd;
      font-size:12px;
      color:#666;
    ">
      📍 Donor search radius:
      <strong>5 km</strong>
    </div>

  </div>
`;
L.marker([lat, lng], {
  icon: bloodIcon
})
  .addTo(map)
  .bindPopup(popupContent)
  .openPopup();
const currentLocationIcon = L.divIcon({
  className: "current-location-marker",
  html: `
    <div class="gps-marker">
      <div class="gps-dot"></div>
    </div>
  `,
  iconSize: [40, 40],
  iconAnchor: [20, 20]
});
L.marker([lat, lng], {
  icon: currentLocationIcon
})
  .addTo(map)
  .bindPopup("<strong>📍 Current location</strong>");
L.circle([lat, lng], {
  radius: 5000,
  color: "#c1121f",
  fillColor: "#c1121f",
  fillOpacity: 0.10,
  weight: 2,
  dashArray: "8, 8"
}).addTo(map);
const radiusLabel = L.control({ position: "topright" });

radiusLabel.onAdd = function() {
  const div = L.DomUtil.create("div");
  div.innerHTML = "🔴 SEARCH RADIUS: <strong>5 KM</strong>";
  div.style.background = "white";
  div.style.padding = "8px 12px";
  div.style.borderRadius = "6px";
  div.style.boxShadow = "0 2px 8px rgba(0,0,0,0.2)";
  div.style.fontSize = "12px";
  div.style.fontWeight = "600";
  return div;
};

radiusLabel.addTo(map);
  window.requestMapInstance = map;

  setTimeout(()=>map.invalidateSize(),100);
}
function lookupDonor(){
  const phone = document.getElementById("lookupPhone").value.trim();
  const donor = cache.donors.find(d=>d.phone===phone);
  if(!donor){ toast("No donor found with that phone number"); return; }
  currentDonorId = donor.id;
  localStorage.setItem("hemolink_donor_id", donor.id);
  refreshAll();
}

function switchDonor(){
  currentDonorId = null;
  localStorage.removeItem("hemolink_donor_id");
  renderDonorView();
}

async function acceptRequest(requestId){
  try{
    await api(`/acceptances/${requestId}/accept/${currentDonorId}`, {method:"POST"});
    toast("Accepted — head to the hospital");
    flashPulse();
    await refreshAll();
  }catch(e){ toast(e.message); }
}

/* ============== HOSPITAL VIEW ============== */

function renderHospitalView(){
  const el = document.getElementById("hospitalView");
const activeRequests = cache.requests.filter(
  r => r.status === "open" || r.status === "matching"
).length;

const fulfilledRequests = cache.requests.filter(
  r => r.status === "fulfilled"
).length;

const pendingMatches = Object.values(cache.acceptancesByRequest)
  .flat()
  .filter(a => a.status === "pending").length;
  el.innerHTML = `
 <div class="stats-grid">

  <div class="stat-card">
    <div class="stat-value">${activeRequests}</div>
    <div class="stat-label">Active Requests</div>
  </div>

  <div class="stat-card">
    <div class="stat-value">${cache.donors.length}</div>
    <div class="stat-label">Registered Donors</div>
  </div>

  <div class="stat-card">
    <div class="stat-value">${fulfilledRequests}</div>
    <div class="stat-label">Fulfilled</div>
  </div>

  <div class="stat-card">
    <div class="stat-value">${pendingMatches}</div>
    <div class="stat-label">Pending Matches</div>
  </div>

</div>   
<h2>New blood request</h2>
    <p class="section-note">Matching starts at 5km and expands automatically if too few donors are found.</p>
    <div class="card">
      <div class="grid-2">
        <div>
          <label>Hospital name</label>
          <input id="reqHospital" placeholder="e.g. St. Mary's Hospital" />
        </div>
        <div>
          <label>Blood group needed</label>
          <select id="reqBlood">${BLOOD_GROUPS.map(b=>`<option>${b}</option>`).join("")}</select>
        </div>
        <div>
          <label>Units needed</label>
          <input id="reqUnits" type="number" min="1" value="1" />
        </div>
        <div>
          <label>Urgency</label>
          <select id="reqUrgency">
            <option value="critical">Critical</option>
            <option value="urgent" selected>Urgent</option>
            <option value="standard">Standard</option>
          </select>
        </div>
      </div>
      <label>Location</label>
      <div class="row" style="margin-bottom:14px;">
        <span class="mono muted" style="font-size:12px;" id="reqLoc">${DEFAULT_LAT.toFixed(4)}, ${DEFAULT_LNG.toFixed(4)} (default)</span>
        <button class="secondary small" onclick="useMyLocation('req')">Use my location</button>
      </div>
<div id="requestMap" class="request-map"></div>
      <button onclick="createRequest()">Create request &amp; find donors</button>
    </div>

    <h2 style="margin-top:28px;">Active &amp; recent requests</h2>
    ${cache.requests.length===0 ? `<div class="empty">No requests yet.</div>` :
      cache.requests.map(r=>{
        const accs = cache.acceptancesByRequest[r.id] || [];
        return `
        <div class="card">
          <div class="row">
            <div>
              <strong>${r.hospital_name}</strong>
              <span class="badge blood" style="margin-left:6px;">${r.blood_group_needed}</span>
              <span class="badge urgent-${r.urgency}">${r.urgency}</span>
              <span class="badge status-${r.status}">${r.status}</span>
            </div>
       <div class="request-meta">
  <span>🩸 ${r.blood_group_needed}</span>
  <span>📦 ${r.units_needed} unit${r.units_needed > 1 ? "s" : ""}</span>
  <span>📍 ${r.current_radius_km}km radius</span>
  <span>🕒 ${fmtDate(r.created_at)}</span>
</div>
  
          ${accs.length===0 ? `<p class="muted" style="font-size:12px;margin:10px 0 0;">No donors have accepted yet.</p>` :
            `<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">
              ${accs.map(a=>{
                const d = cache.donors.find(x=>x.id===a.donor_id);
                return `
                <div class="row" style="background:#141414;padding:8px 12px;border-radius:6px;">
                  <span style="font-size:13px;">${d ? d.name : a.donor_id.slice(0,8)} <span class="muted mono" style="font-size:11px;">${d ? d.phone : ''}</span></span>
                  <span class="row" style="gap:8px;width:auto;">
                    <span class="badge status-${a.status}">${a.status.replace('_',' ')}</span>
                    ${a.status==="pending" ? `<button class="small" onclick="fulfillAcceptance('${a.id}')">Mark fulfilled</button>` : ""}
                  </span>
                </div>`;
              }).join("")}
            </div>`
          }
        </div>`;
      }).join("")
    }

    <h2 style="margin-top:28px;">Donor pool</h2>
    <p class="section-note">${cache.donors.length} registered donor(s).</p>
    ${cache.donors.map(d=>`
      <div class="card row">
        <div>
          <strong>${d.name}</strong>
          <span class="badge blood" style="margin-left:6px;">${d.blood_group}</span>
          ${d.is_verified ? '<span class="badge verified">✓ verified</span>' : ''}
          ${d.is_suspended ? '<span class="badge urgent-critical">suspended</span>' : ''}
        </div>
        <span class="row" style="gap:10px;width:auto;">
          <span class="muted mono" style="font-size:12px;">score ${Math.round(d.reliability_score)} · ${d.total_donations} donations</span>
          ${(!d.is_verified && d.total_donations>0) ? `<button class="small secondary" onclick="verifyDonor('${d.id}')">Verify</button>` : ""}
        </span>
      </div>
    `).join("")}
  `;
initRequestMap();
}

async function createRequest(){
 const hospital_name = document.getElementById("reqHospital").value.trim();
  const blood_group_needed = document.getElementById("reqBlood").value;
  const units_needed = parseInt(document.getElementById("reqUnits").value) || 1;
  const urgency = document.getElementById("reqUrgency").value;
  const locEl = document.getElementById("reqLoc");
  const latitude = parseFloat(locEl.dataset.lat || DEFAULT_LAT);
  const longitude = parseFloat(locEl.dataset.lng || DEFAULT_LNG);
  if(!hospital_name){ toast("Enter the hospital name"); return; }
  try{
    await api("/requests/", {method:"POST", body:JSON.stringify({
      hospital_name, blood_group_needed, units_needed, urgency, latitude, longitude, eta_window_minutes:45
    })});
    toast("Request created — matching donors now");
    flashPulse();
    await refreshAll();
  }catch(e){ toast(e.message); }
}

async function fulfillAcceptance(acceptanceId){
  try{
    await api(`/acceptances/${acceptanceId}/fulfill`, {method:"POST"});
    toast("Marked fulfilled — donor rewarded, others stood down");
    flashPulse();
    await refreshAll();
  }catch(e){ toast(e.message); }
}

async function verifyDonor(donorId){
  try{
    await api(`/donors/${donorId}/verify`, {method:"POST"});
    toast("Donor verified");
    await refreshAll();
  }catch(e){ toast(e.message); }
}

/* ============== INIT ============== */
refreshAll();
setInterval(async () => {
  try {
    cache.donors = await api("/donors/");
    cache.requests = await api("/requests/");

    // Background data refresh only.
    // Do not rebuild the active Donor/Hospital form here.
    // Re-rendering destroys values currently being entered.

  }catch(e){
    console.error("Background refresh failed:", e);
  }
}, 5000);

// Updates just the countdown timer's text every second, without touching
// the rest of the page (so it never interrupts typing in a form field).
setInterval(()=>{
  const timerEl = document.getElementById("etaTimer");
  if(timerEl){
    timerEl.textContent = timeRemaining(timerEl.dataset.deadline);
  }
}, 1000);
</script>
